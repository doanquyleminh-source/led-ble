<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điều khiển LED 7 đoạn qua BLE</title>
<style>
  :root { --bg:#eef1ec; --panel:#fff; --ink:#1d2a24; --muted:#5f6f67; --line:#cdd6cf; --accent:#1f6f50; --accent-ink:#fff; --seg-off:#e3e8e4; --seg-on:#e5322d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141a17; --panel:#1d2621; --ink:#e8efe9; --muted:#98a89f; --line:#2f3d36; --accent:#4cc196; --accent-ink:#0d1a14; --seg-off:#26322c; --seg-on:#ff4a43; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; display:flex; justify-content:center; padding:20px; }
  main { width:100%; max-width:460px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; align-self:flex-start; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:.9rem; }
  button, select, input[type=number] { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
  button { cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button:disabled, select:disabled, input:disabled { opacity:.45; cursor:not-allowed; }
  input[type=number], select { width:100%; }
  label { display:block; font-size:.88rem; margin-bottom:5px; }
  .row { display:flex; gap:8px; margin-top:12px; } .row > * { flex:1; }
  #status { margin:12px 0 10px; font-size:.9rem; color:var(--muted); }
  .display { display:flex; justify-content:center; margin:6px 0 14px; }
  svg { width:100px; height:auto; }
  .seg { fill:var(--seg-off); transition:fill .1s; } .seg.on { fill:var(--seg-on); }
  .sec { border-top:1px solid var(--line); margin-top:16px; padding-top:14px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .fields > div.full { grid-column:1 / -1; }
  .hidden { display:none !important; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .grid button { font-size:1.1rem; font-weight:600; padding:11px 0; }
  .grid button.active { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .note { font-size:.85rem; color:var(--muted); margin:10px 0 0; }
  .check { display:flex; align-items:center; gap:8px; font-size:.9rem; } .check input { width:18px; height:18px; accent-color:var(--accent); }
  .bar { height:12px; background:var(--seg-off); border-radius:6px; overflow:hidden; } .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .08s linear; }
  .pot-head { display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:8px; } .pot-head b { font-variant-numeric:tabular-nums; }
  .pot-meta { display:flex; justify-content:space-between; margin-top:8px; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  #modeLine, #doneLine { font-size:.9rem; color:var(--muted); margin-top:10px; } #mode { font-weight:600; color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>LED 7 đoạn qua BLE</h1>
  <p class="sub">Điều khiển ESP32 từ máy tính (Chrome hoặc Edge).</p>

  <div class="row" style="margin-top:0">
    <button id="connect" class="primary">Kết nối ESP32</button>
    <button id="disconnect" disabled>Ngắt kết nối</button>
  </div>
  <div id="status">Chưa kết nối</div>

  <div class="display">
    <svg viewBox="0 0 60 100" aria-label="Số đang hiển thị">
      <polygon id="sa" class="seg" points="10,5 50,5 44,12 16,12"/>
      <polygon id="sb" class="seg" points="52,7 52,45 46,40 46,14"/>
      <polygon id="sc" class="seg" points="52,55 52,93 46,86 46,60"/>
      <polygon id="sd" class="seg" points="10,95 50,95 44,88 16,88"/>
      <polygon id="se" class="seg" points="8,55 8,93 14,86 14,60"/>
      <polygon id="sf" class="seg" points="8,7 8,45 14,40 14,14"/>
      <polygon id="sg" class="seg" points="11,50 17,45 43,45 49,50 43,55 17,55"/>
    </svg>
  </div>

  <label for="bright">Độ sáng LED: <span id="brightVal">100</span>%</label>
  <input id="bright" type="range" min="5" max="100" step="1" value="100" disabled>

  <div class="sec">
    <label for="modeSel">Chế độ</label>
    <select id="modeSel" disabled>
      <option value="pot">Điều khiển bằng biến trở</option>
      <option value="manual">Chọn số thủ công</option>
      <option value="up">Đếm lên</option>
      <option value="down">Đếm xuống</option>
      <option value="random">Random số</option>
      <option value="drop">Hiệu ứng giọt nước</option>
      <option value="fade">Hiệu ứng sáng dần / tắt dần</option>
      <option value="butterfly">Hiệu ứng cánh bướm</option>
      <option value="snake">Hiệu ứng rắn săn mồi</option>
    </select>

    <div id="digitsBox" class="grid hidden" style="margin-top:12px"></div>

    <div id="fields" class="fields">
      <div id="f-interval"><label id="l-interval" for="interval">Thời gian (giây)</label><input id="interval" type="number" min="0.1" max="25" step="0.1" value="1" disabled></div>
      <div id="f-count"><label id="l-count" for="count">Số lần (0 = vô hạn)</label><input id="count" type="number" min="0" max="255" step="1" value="3" disabled></div>
      <div id="f-min"><label for="min">Từ số</label><input id="min" type="number" min="0" max="9" value="0" disabled></div>
      <div id="f-max"><label for="max">Đến số</label><input id="max" type="number" min="0" max="9" value="9" disabled></div>
      <div id="f-roll"><label for="roll">Quay số trước khi ra (giây, 0 = tắt)</label><input id="roll" type="number" min="0" max="5" step="0.1" value="1.5" disabled></div>
      <div id="f-fdigit"><label for="fdigit">Số hiển thị</label><input id="fdigit" type="number" min="0" max="9" value="8" disabled></div>
      <div id="f-fade" class="full"><label class="check"><input id="fade" type="checkbox" disabled> Mỗi số sáng dần rồi tắt dần</label></div>
    </div>

    <p id="note" class="note"></p>
    <div class="row">
      <button id="start" class="primary" disabled>Bắt đầu</button>
      <button id="stop" disabled>Dừng (giữ số)</button>
    </div>
    <div id="doneLine"></div>
    <div id="modeLine">Trạng thái LED: <span id="mode">-</span></div>
  </div>

  <div class="sec">
    <div class="pot-head"><span>Biến trở 10k</span><b id="potPct">-</b></div>
    <div class="bar"><i id="potBar"></i></div>
    <div class="pot-meta"><span>ADC: <span id="potRaw">-</span> / 4095</span><span>Điện áp: <span id="potVolt">-</span> V</span></div>
  </div>
</main>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CMD_UUID     = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const STAT_UUID    = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const MAP = ["abcdef","bc","abdeg","abcdg","bcfg","acdfg","acdefg","abc","abcdefg","abcdfg"];
const STATUS_NAMES = ["Biến trở điều khiển","Máy tính điều khiển","Đang đếm lên","Đang đếm xuống","Đang random","Hiệu ứng giọt nước","Hiệu ứng sáng dần/tắt dần","Hiệu ứng cánh bướm","Hiệu ứng rắn săn mồi"];

// Mỗi chế độ: lệnh, các ô cài đặt cần hiện, nhãn và ghi chú
const CFG = {
  pot:    { fields:[], note:"LED hiển thị theo núm xoay biến trở. Chọn chế độ này sẽ áp dụng ngay." },
  manual: { fields:[], digits:true, note:"Bấm số để hiển thị ngay trên LED." },
  up:     { cmd:0xA1, fields:["interval","count","min","max","fade"], iv:"Thời gian mỗi số (giây)", cv:"Số vòng (0 = vô hạn)", note:"Đếm từ số nhỏ đến số lớn của khoảng, rồi quay lại." },
  down:   { cmd:0xA2, fields:["interval","count","min","max","fade"], iv:"Thời gian mỗi số (giây)", cv:"Số vòng (0 = vô hạn)", note:"Đếm từ số lớn xuống số nhỏ của khoảng, rồi quay lại." },
  random: { cmd:0xA3, fields:["interval","count","min","max","roll","fade"], iv:"Thời gian giữ mỗi số (giây)", cv:"Số lần random (0 = vô hạn)", note:"Random trong khoảng, không trùng số trước. Quay số sẽ chạy nhanh rồi chậm dần trước khi chốt." },
  drop:   { cmd:0xB1, fields:["interval","count"], iv:"Thời gian mỗi khung (giây)", cv:"Số chu kỳ (0 = vô hạn)", note:"Giọt nước rơi rồi lan thành gợn sóng, mỗi khung sáng dần rồi tối dần. Cần nối OE vào GPIO4. Nên đặt 0.2 đến 0.4 giây mỗi khung." },
  fade:   { cmd:0xB2, fields:["interval","count","fdigit"], iv:"Thời gian sáng dần (giây)", cv:"Số chu kỳ (0 = vô hạn)", note:"Cần nối chân OE (13) của 74HC595 vào GPIO4." },
  butterfly:{ cmd:0xB3, fields:["interval","count"], iv:"Thời gian mỗi khung (giây)", cv:"Số chu kỳ (0 = vô hạn)", note:"Bướm đập cánh: thân (đoạn giữa) sáng cố định, cánh sáng dần khi đến và tối dần khi rời đi. Nên đặt 0.3 đến 0.6 giây mỗi khung." },
  snake:  { cmd:0xB4, fields:["interval","count"], iv:"Thời gian mỗi bước (giây)", cv:"Số mồi cần ăn (0 = vô hạn)", note:"Rắn chạy quanh viền, ăn mồi nhấp nháy thì dài thêm." }
};
const FIELD_IDS = ["interval","count","min","max","roll","fdigit","fade"];

let device, cmdChar, statChar, connected = false, lastTotal = 0;
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

for (let i = 0; i < 10; i++) {
  const b = document.createElement("button");
  b.textContent = i; b.dataset.n = i; b.disabled = true;
  b.onclick = () => write([i]);
  $("digitsBox").appendChild(b);
}

function render(n, mode, done, mask, br) {
  "abcdefg".split("").forEach((s, i) => $("s" + s).classList.toggle("on", mask != null ? !!((mask >> i) & 1) : MAP[n].includes(s)));
  const op = br == null ? 1 : 0.2 + 0.8 * br / 255;
  document.querySelector("svg").style.opacity = mode === 7 ? 1 : op;       // bướm: chỉ cánh mờ, thân giữ nguyên
  "abcdefg".split("").forEach(s => $("s" + s).style.opacity = (mode === 7 && s !== "g") ? op : "");
  document.querySelectorAll("#digitsBox button").forEach(b => b.classList.toggle("active", mode === 1 && Number(b.dataset.n) === n));
  $("mode").textContent = STATUS_NAMES[mode] || "-";
  $("doneLine").textContent = (mode >= 2) ? "Đã chạy: " + done + " / " + (lastTotal === 0 ? "∞" : lastTotal) : "";
}
function onStatus(v) {
  render(v.getUint8(0), v.getUint8(1), v.byteLength >= 5 ? v.getUint8(4) : 0,
         v.byteLength >= 6 ? v.getUint8(5) : null, v.byteLength >= 7 ? v.getUint8(6) : null);
  if (v.byteLength >= 4) renderPot(v.getUint16(2, true));
}
function renderPot(raw) {
  const pct = raw / 4095 * 100;
  $("potBar").style.width = pct.toFixed(1) + "%";
  $("potPct").textContent = pct.toFixed(0) + "%";
  $("potRaw").textContent = raw;
  $("potVolt").textContent = (raw / 4095 * 3.3).toFixed(2);
}

// Hiện ô cài đặt theo chế độ đang chọn
function applyMode() {
  const m = $("modeSel").value, c = CFG[m];
  FIELD_IDS.forEach(f => $("f-" + f).classList.toggle("hidden", !c.fields.includes(f)));
  $("fields").classList.toggle("hidden", c.fields.length === 0);
  $("digitsBox").classList.toggle("hidden", !c.digits);
  if (c.iv) $("l-interval").textContent = c.iv;
  if (c.cv) $("l-count").textContent = c.cv;
  $("note").textContent = c.note || "";
  $("start").classList.toggle("hidden", !c.cmd);
  if (m === "pot" && connected) write([0xFF]);
}

function setEnabled(on) {
  connected = on;
  ["modeSel","bright","start","stop","disconnect",...FIELD_IDS].forEach(id => $(id).disabled = !on);
  document.querySelectorAll("#digitsBox button").forEach(b => b.disabled = !on);
  $("connect").disabled = on;
}

async function write(v) {
  if (!cmdChar) return;
  try { await cmdChar.writeValueWithoutResponse(Uint8Array.from(v)); }
  catch (e) { $("status").textContent = "Lỗi gửi lệnh: " + e.message; }
}

function num(id, d, a, b) { const x = parseFloat($(id).value); return clamp(isNaN(x) ? d : x, a, b); }

function startMode() {
  const m = $("modeSel").value, c = CFG[m];
  if (!c.cmd) return;
  const t = Math.round(num("interval", 1, 0.1, 25) * 10);
  const n = Math.round(num("count", 0, 0, 255));
  let a = Math.round(num("min", 0, 0, 9)), b = Math.round(num("max", 9, 0, 9));
  if (a > b) [a, b] = [b, a];
  lastTotal = n;
  const msg = [c.cmd, t, n];
  if (m === "up" || m === "down") msg.push(a, b, $("fade").checked ? 1 : 0);
  else if (m === "random") msg.push(a, b, $("fade").checked ? 1 : 0, Math.round(num("roll", 0, 0, 5) * 10));
  else if (m === "fade") msg.push(Math.round(num("fdigit", 8, 0, 9)));
  write(msg);
}

let brTimer = null;
function sendBrightness() {
  const level = Math.round(Number($("bright").value) * 2.55);
  write([0xC0, level]);
}
$("bright").oninput = () => {
  $("brightVal").textContent = $("bright").value;
  if (!brTimer) brTimer = setTimeout(() => { brTimer = null; sendBrightness(); }, 60);
};
$("modeSel").onchange = applyMode;
$("start").onclick = startMode;
$("stop").onclick = () => write([0xA0]);

$("connect").onclick = async () => {
  if (!navigator.bluetooth) { $("status").textContent = "Trình duyệt không hỗ trợ Web Bluetooth. Hãy dùng Chrome hoặc Edge."; return; }
  try {
    $("status").textContent = "Đang tìm thiết bị...";
    device = await navigator.bluetooth.requestDevice({ filters: [{ name: "ESP32-7SEG" }], optionalServices: [SERVICE_UUID] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    cmdChar = await service.getCharacteristic(CMD_UUID);
    statChar = await service.getCharacteristic(STAT_UUID);
    statChar.addEventListener("characteristicvaluechanged", e => onStatus(e.target.value));
    await statChar.startNotifications();
    const first = await statChar.readValue();
    if (first.byteLength >= 4) onStatus(first);
    $("status").textContent = "Đã kết nối: " + device.name;
    setEnabled(true);
    sendBrightness();          // đồng bộ độ sáng với thanh trượt
  } catch (e) { $("status").textContent = "Không kết nối được: " + e.message; }
};
$("disconnect").onclick = () => { if (device && device.gatt.connected) device.gatt.disconnect(); };

function onDisconnected() {
  cmdChar = statChar = null;
  setEnabled(false);
  $("status").textContent = "Đã ngắt kết nối";
  $("mode").textContent = "-"; $("doneLine").textContent = "";
  ["potPct","potRaw","potVolt"].forEach(id => $(id).textContent = "-");
  $("potBar").style.width = "0";
}

applyMode();
render(0, 0, 0);
$("mode").textContent = "-";
</script>
</body>
</html>
